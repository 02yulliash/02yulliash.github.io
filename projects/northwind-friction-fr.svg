<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Analyse qualitative des plaintes clients</title>
  <desc id="desc">Le paiement et l'inscription représentent 53 pour cent des plaintes analysées.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}.navy{fill:#222b68}.blue{fill:#247e9c}
    .muted{fill:#52617c}.red{fill:#d74450}.light{fill:#dbe3f4}
  </style>

  <text x="84" y="84" class="sans blue" font-size="22" font-weight="700">ANALYSE QUALITATIVE</text>
  <text x="84" y="174" class="sans navy" font-size="48" font-weight="700">Les clients signalent le même problème</text>
  <text x="84" y="226" class="sans muted" font-size="23" font-style="italic">Les plaintes publiées sur les réseaux sociaux ont été lues et regroupées par thème.</text>

  <line x1="318" y1="282" x2="318" y2="806" stroke="#afb4bd" stroke-width="2"/>
  <g class="sans navy" font-size="20" text-anchor="end">
    <text x="306" y="354">Vitesse du site</text>
    <text x="306" y="486">Paiement / Info produit</text>
    <text x="306" y="618">UX / Navigation / Conception</text>
    <text x="306" y="750">Paiement / Inscription</text>
  </g>
  <rect x="318" y="300" width="56" height="94" rx="2" class="blue"/>
  <rect x="318" y="432" width="111" height="94" rx="2" class="blue"/>
  <rect x="318" y="564" width="221" height="94" rx="2" class="blue"/>
  <rect x="318" y="696" width="440" height="94" rx="2" class="red"/>
  <g class="sans muted" font-size="19">
    <text x="384" y="354">7 %</text>
    <text x="439" y="486">13 %</text>
    <text x="549" y="618">27 %</text>
    <text x="768" y="750">53 %</text>
  </g>

  <rect x="954" y="270" width="570" height="547" class="navy"/>
  <text x="1008" y="336" class="sans light" font-size="20" font-weight="700">RÉSULTAT PRINCIPAL</text>
  <text x="1008" y="444" class="sans" fill="#ffffff" font-size="88" font-weight="700">53 %</text>
  <text x="1008" y="506" class="sans light" font-size="22">
    <tspan x="1008" dy="0">des plaintes mentionnent le paiement ou l’inscription</tspan>
    <tspan x="1008" dy="28">obligatoire - plus que toutes les autres catégories</tspan>
    <tspan x="1008" dy="28">réunies.</tspan>
  </text>
  <text x="1008" y="692" class="sans light" font-size="20" font-style="italic">
    <tspan x="1008" dy="0">La navigation, la clarté des produits et la vitesse du</tspan>
    <tspan x="1008" dy="26">site apparaissent aussi, mais moins souvent.</tspan>
  </text>
  <text x="1565" y="873" text-anchor="end" class="sans muted" font-size="15">05</text>
</svg>
